name: Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set Supabase Secrets
        run: |
          supabase secrets set --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} \
            TELEGRAM_TOKEN_SECRETARIA=${{ secrets.TELEGRAM_TOKEN_SECRETARIA }} \
            TELEGRAM_TOKEN_ALUMBRA=${{ secrets.TELEGRAM_TOKEN_ALUMBRA }} \
            TELEGRAM_TOKEN_POWERTRADER=${{ secrets.TELEGRAM_TOKEN_POWERTRADER }} \
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Function
        run: |
          supabase functions deploy telegram-bot --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
